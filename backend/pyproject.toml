[project]
name = "bandit"
version = "0.1.0"
description = "Monitoreo de incidentes para establecimientos con cámaras RTSP"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1",
  "asyncpg>=0.29",
  "cryptography>=42",
  "email-validator>=2.1",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.27",
  "pillow>=10.3",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "pydantic-settings>=2.3",
  "pywebpush>=2.0",
  "selectolax>=1.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "import-linter>=2.0",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bandit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bandit"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pywebpush.*", "selectolax.*"]
ignore_missing_imports = true
